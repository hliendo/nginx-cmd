# =========================================================================
# Base Security Headers / Cabeceras de Seguridad Comunes
# =========================================================================
# Applied globally to protect apps from common web vulnerabilities.
# Aplicado para proteger las aplicaciones contra vulnerabilidades web comunes.

# HSTS: Forces browsers to strictly use HTTPS (Mitigates downgrade attacks)
# HSTS: Obliga a los navegadores a conectarse solo por HTTPS en los próximos 5 mins (300s).
add_header Strict-Transport-Security "max-age=300" always;

# X-XSS-Protection: Cross-Site Scripting filter built into most browsers.
# Bloquea carga completa de la página si el navegador detecta un ataque XSS.
add_header X-XSS-Protection "1; mode=block" always;

# MIME Sniffing protection: Prevents browsers from guessing file types.
# Evita que el navegador ignore el Content-Type declarado e intercepte descargas nocivas.
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking protection: Denies rendering this site inside an iframe.
# Evita ataques de Clickjacking prohibiendo que la app se cargue en un iFrame ajeno.
add_header X-Frame-Options "DENY" always;

# Referrer-Policy: Prevents leaking full URLs when navigating to external sites.
# Evita que la ruta completa de nuestra app se filtre cuando el usuario clickea un link externo.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions-Policy: Disables unnecessary browser features (Camera, GPS, Mic).
# Deshabilita hardware del usuario por defecto para evitar abusos o alertas de privacidad innecesarias.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Cache-Control: Caches static assets aggressively (3 months).
# Agresividad en caché de estáticos general (3 meses) para acelerar tiempos de carga recurrentes.
add_header Cache-Control "public, max-age=7776000" always;
