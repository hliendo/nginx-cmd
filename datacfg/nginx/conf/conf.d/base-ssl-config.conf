# =========================================================================
# Base SSL Configuration / Configuración Estándar SSL
# =========================================================================
# Created to eliminate SSL configuration duplication across domains.
# Centraliza la seguridad SSL siguiendo principios DRY.

# Secure SSL Protocols / Protocolos SSL Modernos 
ssl_protocols TLSv1.2 TLSv1.3;

# Modern Safe Ciphers / Conjunto de encriptaciones fuertes
ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;

# Enforce Server Ciphers over Client
ssl_prefer_server_ciphers on;

# SSL Session Optimization / Optimización de Sesiones
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
