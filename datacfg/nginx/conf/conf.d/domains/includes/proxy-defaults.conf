# =========================================================================
# CDC Forwarding Defaults / Cabeceras Estándar de Transporte Proxy
# =========================================================================
# Included in all Proxy domains to standardize traffic identity.
# Incluido en proxies para asegurar que el backend sepa quién es el cliente original real.
# Usage / Uso: include /opt/nginx/conf/conf.d/domains/includes/proxy-defaults.conf;

proxy_http_version 1.1;

# Passes the originally requested host domain / Pasa el dominio real que tipea el usuario.
proxy_set_header Host $host;

# Passes the real client IP / Identifica la IP local o pública de la persona, no la de Nginx.
proxy_set_header X-Real-IP $remote_addr;

# Appends IP to proxy chain / Añade la IP a la cadena de proxies atravesados.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# Tells backend if traffic was HTTP or HTTPS / Avisa al backend si la conexión fue segura.
proxy_set_header X-Forwarded-Proto $scheme;

# Timeouts & Error Handling (Defaults)
# Standardized to 60s for corporate apps with slow backends (e.g. huge PDF reports)
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
send_timeout 60s;

proxy_next_upstream error timeout invalid_header http_502 http_504;
proxy_next_upstream_tries 3;

# Optional: Evita que Nginx se caiga si el backend está temporalmente down
proxy_intercept_errors on;
