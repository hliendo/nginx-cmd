# =========================================================================
# CDC Proxy Fault Tolerance / Tolerancia a Fallos en Proxies
# =========================================================================
# Included inside 'location' blocks / Incluido dentro de los bloques location en proxies
# Usage / Uso: include /opt/nginx/conf/conf.d/domains/includes/proxy-fault-tolerance.conf;

# Defines timeout for establishing a connection with the proxied server.
# Define el tiempo máximo para que Nginx logre conectarse al Node/Python backend.
proxy_connect_timeout 5s;

# Timeout for transmitting a request to the proxied server.
# Tiempo máximo para enviar los datos hacia el backend.
proxy_send_timeout 60s;

# Timeout for reading a response from the proxied server.
# Tiempo de espera máximo a que el backend procese responda (Ej: query lenta en API).
proxy_read_timeout 60s;

# Determine under what conditions the request is passed to the next server.
# Si el backend falla o da error HTTP 502/504, Nginx intenta reenviar si hay un cluster.
proxy_next_upstream error timeout invalid_header http_502 http_504;
proxy_next_upstream_tries 3;

# Prevents Nginx from crashing completely if backend is entirely down
# Transforma los errores horrendos del backend en páginas amigables controladas por Nginx
proxy_intercept_errors on;
