# =========================================================================
# CDC WebSocket Support / Soporte para WebSockets
# =========================================================================
# Enables connection upgrade from HTTP to ws:// or wss://
# Habilita que una conexión HTTP tradicional se "eleve" a una bidireccional continua.
# Usage / Uso: include /opt/nginx/conf/conf.d/domains/includes/proxy-websocket.conf;

# WebSockets MUST use HTTP/1.1, HTTP/1.0 does not support keep-alive properly.
# WebSockets obliga a usar protocolo HTTP/1.1 para mantener la tubería abierta.
proxy_http_version 1.1;

# Passes the Upgrade request headers from client to backend. 
# Transfiere la petición mágica "Upgrade" hacia el backend (Node.js/Go/Rust).
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
