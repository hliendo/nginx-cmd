# =========================================================================
# CDC Proxy Timeouts / Timeouts Estándar para Proxies
# =========================================================================
# Included in non-streaming proxy domains.
# Para proxies con streaming (SSE/chunks), usar proxy-stream.conf en su lugar.
# Usage / Uso: include /opt/nginx/conf/conf.d/domains/includes/proxy-timeouts.conf;

proxy_send_timeout 60s;
proxy_read_timeout 60s;
send_timeout 60s;
