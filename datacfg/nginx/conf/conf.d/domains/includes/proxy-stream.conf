# =========================================================================
# CDC HTTP Streaming / Soporte para Server-Sent Events (SSE) y Streams HTTP
# =========================================================================
# Usage / Uso: include /opt/nginx/conf/conf.d/domains/includes/proxy-stream.conf;

# Disables Nginx buffering to allow immediate chunk delivery
# Desactiva el empaquetamiento interno de Nginx para entregar pedazos de video/datos de inmediato a medida que llegan.
proxy_buffering off;
proxy_cache off;

# Required for chunked responses / Requerido para respuestas divididas en stream
chunked_transfer_encoding on;

# Prevents proxy connection closing on long streams / Evita cierres prematuros en conexiones persistentes
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
