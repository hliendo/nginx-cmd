# unifi.example.com - UniFi Controller (ejemplo)
# Tipo: Reverse Proxy
# Target: 192.168.1.10:8443 (HTTPS con self-signed cert)

server {
    listen 80;
    server_name unifi.example.com;
    
    location /.well-known/acme-challenge/ {
        root /opt/site/unifi.example.com;
        try_files $uri =404;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name unifi.example.com;
    
    ssl_certificate     /etc/letsencrypt/live/unifi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unifi.example.com/privkey.pem;
    
    include /opt/nginx/conf/conf.d/base-ssl-config.conf;
    include /opt/nginx/conf/conf.d/base-security-headers.conf;
    
    location / {
        proxy_pass https://192.168.1.10:8443;
        proxy_ssl_verify off;
        include /opt/nginx/conf/conf.d/domains/includes/proxy-fault-tolerance.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
