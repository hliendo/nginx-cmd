# unifi.ivvt.com.ar - UniFi Controller IVVT
# Tipo: Reverse Proxy
# Target: 192.168.0.253:8543 (HTTPS con self-signed cert)
# (KAIZEN: Réplica exacta de unifi.cdc.com.ar.conf)

server {
    listen 80;
    server_name unifi.ivvt.com.ar;
    
    location /.well-known/acme-challenge/ {
        root /opt/site/unifi.ivvt.com.ar;
        try_files $uri =404;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name unifi.ivvt.com.ar;
    
    ssl_certificate     /etc/letsencrypt/live/unifi.ivvt.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unifi.ivvt.com.ar/privkey.pem;
    
    include /opt/nginx/conf/conf.d/cdc-ssl-config.conf;
    include /opt/nginx/conf/conf.d/cdc-security-headers.conf;
    
    location / {
        proxy_pass https://192.168.0.253:8543;
        proxy_ssl_verify off;
        include /opt/nginx/conf/conf.d/domains/includes/proxy-fault-tolerance.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
