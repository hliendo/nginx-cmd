# =========================================================================
# Nginx All-In-One Engine - Main Configuration
# =========================================================================
# This is the entrypoint for the Nginx engine. / Este es el punto de entrada del motor Nginx.
# It delegates domain specifics to the conf.d/ folder. / Delega configuraciones de dominios a la carpeta conf.d/.

# Defines the number of worker processes. '1' is safe for basic setups, but 'auto' is better for multi-core.
# Define la cantidad de procesos de trabajo. '1' es seguro para setups básicos, 'auto' maximiza el CPU.
worker_processes  auto;

# =========================================================================
# Events Module / Módulo de Eventos
# =========================================================================
events {
    # Max simultaneous connections per worker / Conexiones máximas simultáneas por worker
    worker_connections  1024;
}

# =========================================================================
# HTTP Core Module / Módulo Core HTTP
# =========================================================================
http {
    # File type definitions / Definiciones de tipos de archivo MIME
    include       mime.types;
    default_type  application/octet-stream;

    # Performance optimizations / Optimizaciones de rendimiento (Copia datos directo en kernel)
    sendfile        on;

    # Connection timeout (sec) / Tiempo máximo para mantener conexión viva (segundos)
    keepalive_timeout  65;

    # =========================================================================
    # Compression Algorithms / Algoritmos de Compresión (GZIP & BROTLI)
    # =========================================================================
    # Brotli (Requires external module / Requiere módulo externo)
    # Reduces bandwidth usage heavily / Reduce el consumo de ancho de banda intensamente
    brotli              on;
    brotli_comp_level   6;
    brotli_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    
    # GZIP (Standard compression / Compresión estándar fallback)
    gzip                on;
    gzip_comp_level     6;
    gzip_types          text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # =========================================================================
    # Logging Configuration / Configuración de Registros
    # =========================================================================
    # Format compatible with Fail2Ban / Formato requerido para el escaneo de Fail2Ban
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
                      
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # =========================================================================
    # MODULAR ARCHITECTURE / ARQUITECTURA MODULAR (DRY Principle)
    # =========================================================================
    
    # [1] Global Security & SSL / Configuración Global Base y SSL
    # Applied to the entire server / Aplica a todo el servidor
    # NOTE: We exclude base-acme-challenge.conf as it contains 'location' blocks (only for server context)
    include /opt/nginx/conf/conf.d/base-security-headers.conf;
    include /opt/nginx/conf/conf.d/base-ssl-config.conf;
    
    # [2] Individual Domain Blocks / Bloques de Dominios Dinámicos
    # These are managed entirely by nginx-cmd / Estos son generados por la herramienta nginx-cmd.
    # To add domains use: nginx-cmd add <domain> / Usar: nginx-cmd add <domain>
    include /opt/nginx/conf/conf.d/domains/*.conf;
    
}

